<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Bird - 填字识字版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #70C5CE;
            font-family: 'Courier New', Courier, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #debug-log {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            padding: 5px;
            z-index: 9999;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="debug-log"></div>
<div id="game-container">
    <canvas id="birdCanvas"></canvas>
</div>

<script>
    window.onerror = function(msg, url, line) {
        const log = document.getElementById("debug-log");
        if(log) {
            log.style.display = "block";
            log.innerText = "Error: " + msg + " (line " + line + ")";
        }
        return false;
    };

    const canvas = document.getElementById("birdCanvas");
    const ctx = canvas.getContext("2d");

    function getSafeBestScore() {
        try {
            return parseInt(localStorage.getItem("flappy_best_en")) || 0;
        } catch(e) {
            return 0;
        }
    }

    function setSafeBestScore(val) {
        try {
            localStorage.setItem("flappy_best_en", val);
        } catch(e) {}
    }

    let selectedMode = null; 
    let gameState = "SELECT"; 
    let score = 0;
    let bestScore = getSafeBestScore();
    let frames = 0;
    let isHolding = false;
    let isMuted = false;

    // 血条与连对系统
    let hp = 5;
    const maxHp = 5;
    let streak = 0; // 连续答对计数器

    const chineseSentences = [
        { text: "一心一__", answer: "意", distractors: ["忆", "异", "易"] },
        { text: "画龙点__", answer: "睛", distractors: ["精", "晴", "晶"] },
        { text: "守株待__", answer: "兔", distractors: ["土", "吐", "途"] },
        { text: "三心二__", answer: "意", distractors: ["易", "忆", "益"] },
        { text: "自相矛__", answer: "盾", distractors: ["顿", "钝", "敦"] },
        { text: "井底之__", answer: "蛙", distractors: ["娃", "袜", "挖"] },
        { text: "亡羊补__", answer: "牢", distractors: ["劳", "老", "姥"] },
        { text: "掩耳盗__", answer: "铃", distractors: ["零", "领", "羚"] },
        { text: "雪中送__", answer: "炭", distractors: ["探", "叹", "碳"] },
        { text: "春风吹又__", answer: "生", distractors: ["声", "深", "升"] }
    ];
    let currentSentenceIndex = 0;
    let currentTargetChar = "";
    let currentDisplayPrompt = "";

    function loadNextSentence() {
        currentSentenceIndex = Math.floor(Math.random() * chineseSentences.length);
        const item = chineseSentences[currentSentenceIndex];
        currentTargetChar = item.answer;
        currentDisplayPrompt = item.text;
    }

    // 静音按钮区域
    let btnMuteRect = { x: 15, y: 15, w: 42, h: 42 };

    let stars = [];
    let candies = [];

    function generateStars() {
        stars = [];
        const count = 75;
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * (canvas.width || 300),
                y: Math.random() * ((canvas.height || 500) * 0.65),
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.01
            });
        }
    }

    function generateCandies() {
        candies = [];
        const colors = ['#FF70A6', '#FF9770', '#FFDC5E', '#A3E7FC', '#C8B6FF', '#B5EAD7'];
        for (let i = 0; i < 12; i++) {
            let typeRand = Math.random();
            let type = 'candy';
            if (typeRand < 0.35) type = 'macaron';
            else if (typeRand < 0.60) type = 'lollipop';
            else if (typeRand < 0.85) type = 'candy';
            else if (typeRand < 0.93) type = 'bunny';
            else type = 'unicorn';

            candies.push({
                x: Math.random() * (canvas.width || 300),
                y: Math.random() * ((canvas.height || 500) * 0.65),
                size: type === 'macaron' ? Math.random() * 4 + 10 : Math.random() * 6 + 10,
                type: type,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 0.25 + 0.1,
                floatOffset: Math.random() * Math.PI * 2
            });
        }
    }

    function isDaytime() {
        const hour = new Date().getHours();
        return hour >= 6 && hour < 18;
    }

    function drawMacaron(size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.25, size, size * 0.55, 0, Math.PI, 0, true);
        ctx.fill();

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(-size * 0.9, -size * 0.25, size * 1.8, size * 0.3);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 0.05 * size, size, size * 0.55, 0, 0, Math.PI, false);
        ctx.fill();
    }

    function drawDoodleUnicorn(size, color) {
        ctx.strokeStyle = color || "#FFF";
        ctx.lineWidth = 1.5;
        ctx.fillStyle = "#FFF";

        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.8, size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#FFD166";
        ctx.beginPath();
        ctx.moveTo(size * 0.3, -size * 0.4);
        ctx.lineTo(size * 0.8, -size * 1.0);
        ctx.lineTo(size * 0.5, -size * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#4A4A4A";
        ctx.beginPath();
        ctx.arc(size * 0.3, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawDoodleBunny(size) {
        ctx.strokeStyle = "#FFB3C6";
        ctx.lineWidth = 1.5;
        ctx.fillStyle = "#FFFFFF";

        ctx.beginPath();
        ctx.ellipse(-size * 0.3, -size * 0.8, size * 0.2, size * 0.5, -0.1, 0, Math.PI * 2);
        ctx.ellipse(size * 0.3, -size * 0.8, size * 0.2, size * 0.5, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(-size * 0.25, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.arc(size * 0.25, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBackground() {
        if (selectedMode === 'girl') {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, "#FFD6E0");
            bgGradient.addColorStop(0.5, "#FFEF96");
            bgGradient.addColorStop(1, "#FFC0D9");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 182, 193, 0.6)";
            ctx.beginPath();
            ctx.moveTo(0, playAreaHeight);
            ctx.quadraticCurveTo(canvas.width * 0.25, playAreaHeight - 45, canvas.width * 0.5, playAreaHeight - 20);
            ctx.quadraticCurveTo(canvas.width * 0.75, playAreaHeight + 10, canvas.width, playAreaHeight - 35);
            ctx.lineTo(canvas.width, playAreaHeight);
            ctx.lineTo(0, playAreaHeight);
            ctx.fill();

            for (let c of candies) {
                c.x -= c.speed;
                if (c.x < -40) c.x = canvas.width + 40;
                let floatY = c.y + Math.sin(frames * 0.03 + c.floatOffset) * 6;

                ctx.save();
                ctx.translate(c.x, floatY);
                if (c.type === 'macaron') drawMacaron(c.size, c.color);
                else if (c.type === 'bunny') drawDoodleBunny(c.size);
                else if (c.type === 'unicorn') drawDoodleUnicorn(c.size, c.color);
                else {
                    ctx.fillStyle = c.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, c.size, c.size * 0.55, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            let cloudOffset = (frames * 0.2) % (canvas.width + 200);
            drawCloud(canvas.width - cloudOffset, playAreaHeight * 0.25, 1);
            drawCloud(canvas.width * 1.5 - cloudOffset, playAreaHeight * 0.15, 0.8);

        } else {
            const isDay = isDaytime();
            if (isDay) {
                ctx.fillStyle = "#70C5CE";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#A2D870";
                ctx.beginPath();
                ctx.moveTo(0, playAreaHeight);
                ctx.quadraticCurveTo(canvas.width * 0.25, playAreaHeight - 40, canvas.width * 0.5, playAreaHeight - 15);
                ctx.quadraticCurveTo(canvas.width * 0.75, playAreaHeight + 10, canvas.width, playAreaHeight - 30);
                ctx.lineTo(canvas.width, playAreaHeight);
                ctx.lineTo(0, playAreaHeight);
                ctx.fill();

                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                let cloudOffset = (frames * 0.2) % (canvas.width + 200);
                drawCloud(canvas.width - cloudOffset, playAreaHeight * 0.25, 1);
                drawCloud(canvas.width * 1.5 - cloudOffset, playAreaHeight * 0.15, 0.8);
            } else {
                let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, "#0B132B");
                gradient.addColorStop(0.6, "#1C2541");
                gradient.addColorStop(1, "#3A506B");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let star of stars) {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, star.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.arc(15, -10, 22, 0, Math.PI * 2);
        ctx.arc(35, -5, 18, 0, Math.PI * 2);
        ctx.arc(45, 5, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Web Audio API
    let audioCtx = null;
    let isMusicPlaying = false;
    let musicInterval = null;

    const melody = [
        261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
        293.66, 349.23, 440.00, 587.33, 440.00, 349.23
    ];
    let noteIndex = 0;

    function initAudio() {
        if (!audioCtx) {
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) audioCtx = new AudioCtxClass();
            } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(()=>{});
        }
    }

    function playNote(freq, duration, type = 'square', volume = 0.05) {
        if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playScoreSound() {
        playNote(523.25, 0.1, 'square', 0.08);
        setTimeout(() => playNote(659.25, 0.15, 'square', 0.08), 80);
    }

    function playHurtSound() {
        playNote(180, 0.2, 'sawtooth', 0.09);
    }

    function playJumpSound() {
        if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function startBGM() {
        initAudio();
        if (isMusicPlaying) return;
        
        isMusicPlaying = true;
        musicInterval = setInterval(() => {
            if ((gameState === "PLAYING" || gameState === "START") && !isMuted) {
                let freq = melody[noteIndex];
                playNote(freq, 0.15, 'square', 0.04);
                noteIndex = (noteIndex + 1) % melody.length;
            }
        }, 180);
    }

    function stopBGM() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
        isMusicPlaying = false;
    }

    let groundHeight = 80;
    let playAreaHeight = 0;
    let baseSpeed = 2.5; 

    function getCurrentSpeed() {
        let multiplier = Math.pow(1.02, score); 
        return Math.min(baseSpeed * 2.5, baseSpeed * multiplier); 
    }

    function resizeCanvas() {
        const w = window.innerWidth || document.documentElement.clientWidth || 360;
        const h = window.innerHeight || document.documentElement.clientHeight || 640;
        
        canvas.width = w;
        canvas.height = h;
        
        groundHeight = Math.max(60, Math.floor(h * 0.12));
        playAreaHeight = h - groundHeight;

        baseSpeed = Math.max(2.5, w * 0.0038);

        generateStars();
        generateCandies();

        if (gameState === "START" || gameState === "SELECT") {
            bird.x = Math.min(100, w * 0.18);
            bird.y = playAreaHeight / 2;
        }
    }

    const bird = {
        x: 80,
        y: 300, 
        radius: 18,
        hitRadius: 15,
        gravity: 0.25,      
        thrust: -0.32,      
        maxSpeed: 5.5,      
        velocity: 0,
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.1));
            ctx.rotate(angle);

            ctx.fillStyle = "#F8D030";
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000";
            ctx.stroke();

            ctx.fillStyle = "#FFF";
            ctx.beginPath();
            ctx.arc(6, -6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(8, -6, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#F05A24";
            ctx.beginPath();
            ctx.arc(8, 4, 8, 0, Math.PI);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#E0C020";
            ctx.beginPath();
            let wingY = Math.sin(frames * 0.3) * 3;
            if (ctx.ellipse) {
                ctx.ellipse(-6, wingY, 7, 5, 0, 0, Math.PI * 2);
            } else {
                ctx.arc(-6, wingY, 6, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.stroke();

            if (selectedMode === 'chinese') {
                ctx.fillStyle = "#D90429";
                ctx.beginPath();
                ctx.arc(0, -this.radius + 3, 9, Math.PI, 0);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.arc(0, -this.radius - 3, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        },

        update() {
            if (gameState === "PLAYING") {
                if (isHolding) {
                    this.velocity += this.thrust;
                } else {
                    this.velocity += this.gravity;
                }

                this.velocity = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.velocity));
                this.y += this.velocity;

                if (this.y + this.hitRadius >= playAreaHeight) {
                    this.y = playAreaHeight - this.hitRadius;
                    gameOver();
                }
                if (this.y - this.hitRadius <= 0) {
                    this.y = this.hitRadius;
                    this.velocity = 0;
                }
            } else if (gameState === "START" || gameState === "SELECT") {
                this.y = (playAreaHeight / 2) + Math.sin(frames * 0.05) * 5;
            }
        },

        reset() {
            this.x = Math.min(100, canvas.width * 0.18);
            this.y = playAreaHeight / 2;
            this.velocity = 0;
        }
    };

    // 漂浮汉字生成与判定系统
    const wordBubbles = {
        items: [],
        spawnTimer: 0,
        spawnInterval: 120,
        hasAnsweredCurrentQuestion: false, // 防止同一题被重复判断

        spawnGroup() {
            const item = chineseSentences[currentSentenceIndex];
            let chars = [ { text: item.answer, isCorrect: true } ];
            let count = Math.random() < 0.5 ? 2 : 3;
            let usedDistractors = [...item.distractors].sort(() => 0.5 - Math.random());

            for (let i = 0; i < count - 1; i++) {
                if (usedDistractors[i]) {
                    chars.push({ text: usedDistractors[i], isCorrect: false });
                }
            }
            chars.sort(() => 0.5 - Math.random());

            let totalHeight = playAreaHeight - 180;
            let segment = totalHeight / chars.length;

            chars.forEach((c, index) => {
                let posY = 120 + segment * index + Math.random() * (segment - 40);
                this.items.push({
                    x: canvas.width + 30 + Math.random() * 40,
                    y: posY,
                    radius: 26,
                    text: c.text,
                    isCorrect: c.isCorrect,
                    floatOffset: Math.random() * Math.PI * 2
                });
            });

            this.hasAnsweredCurrentQuestion = false; // 新题目生成，允许碰撞答题
        },

        draw() {
            for (let b of this.items) {
                let waveY = b.y + Math.sin(frames * 0.05 + b.floatOffset) * 4;

                ctx.save();
                ctx.translate(b.x, waveY);

                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = "#E63946";
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = "#2B2D42";
                ctx.font = "bold 22px 'PingFang SC', 'Microsoft YaHei', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(b.text, 0, 2);

                ctx.restore();
            }
        },

        update() {
            if (gameState !== "PLAYING") return;

            this.spawnTimer++;
            if (this.spawnTimer >= this.spawnInterval) {
                this.spawnTimer = 0;
                this.spawnGroup();
            }

            let currentSpeed = getCurrentSpeed();

            for (let i = 0; i < this.items.length; i++) {
                let b = this.items[i];
                b.x -= currentSpeed;

                // 碰撞检测
                let dist = Math.hypot(bird.x - b.x, bird.y - b.y);
                if (dist < bird.hitRadius + b.radius) {
                    if (b.isCorrect) {
                        // 防止一题多撞
                        if (!this.hasAnsweredCurrentQuestion) {
                            this.hasAnsweredCurrentQuestion = true;
                            score++;
                            streak++; // 连对数 +1
                            
                            if (score > bestScore) {
                                bestScore = score;
                                setSafeBestScore(bestScore);
                            }
                            
                            // 严格要求：只有连续答对 3 道题才加 1 格血
                            if (streak >= 3) {
                                if (hp < maxHp) {
                                    hp++;
                                }
                                streak = 0; // 满3次回血后重置连对数，重新计算下一次3连对
                            }

                            playScoreSound();
                            loadNextSentence();
                            this.items = []; // 撞对后清空当前所有字
                            break;
                        }
                    } else {
                        // 撞错字：直接扣血，并将连对数归零
                        hp--;
                        streak = 0; 
                        playHurtSound();
                        this.items.splice(i, 1);
                        i--;
                        if (hp <= 0) {
                            gameOver();
                        }
                        continue;
                    }
                }

                if (b.x + b.radius < 0) {
                    this.items.splice(i, 1);
                    i--;
                }
            }
        },

        reset() {
            this.items = [];
            this.spawnTimer = 0;
            this.hasAnsweredCurrentQuestion = false;
        }
    };

    const fg = {
        x: 0,
        draw() {
            ctx.fillStyle = "#DDD894";
            ctx.fillRect(0, playAreaHeight, canvas.width, groundHeight);
            ctx.fillStyle = "#73BF2E";
            ctx.fillRect(0, playAreaHeight, canvas.width, 14);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, playAreaHeight);
            ctx.lineTo(canvas.width, playAreaHeight);
            ctx.stroke();
        },
        update() {
            if (gameState === "PLAYING") {
                this.x = (this.x - getCurrentSpeed()) % 20;
            }
        }
    };

    function gameOver() {
        gameState = "GAMEOVER";
        isHolding = false;
        stopBGM();
        if (audioCtx) playNote(120, 0.4, 'sawtooth', 0.1);
    }

    function resetGame() {
        bird.reset();
        wordBubbles.reset();
        score = 0;
        hp = maxHp;
        streak = 0; 
        frames = 0;
        loadNextSentence();
        gameState = "PLAYING";
        startBGM();
    }

    function goToHome() {
        bird.reset();
        wordBubbles.reset();
        score = 0;
        hp = maxHp;
        streak = 0; 
        frames = 0;
        selectedMode = null;
        gameState = "SELECT";
        stopBGM();
    }

    let btnBoyRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnGirlRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnChineseRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnMathRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnPlayAgainRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnHomeRect = { x: 0, y: 0, w: 0, h: 0 };

    function drawMuteButton() {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(btnMuteRect.x, btnMuteRect.y, btnMuteRect.w, btnMuteRect.h, 10);
        } else {
            ctx.rect(btnMuteRect.x, btnMuteRect.y, btnMuteRect.w, btnMuteRect.h);
        }
        ctx.fill();

        ctx.strokeStyle = "#FFF";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
            isMuted ? "🔇" : "🔊", 
            btnMuteRect.x + btnMuteRect.w / 2, 
            btnMuteRect.y + btnMuteRect.h / 2 + 1
        );
        ctx.restore();
    }

    // 绘制顶部句子题目与血条（增加连对提示小标记）
    function drawHeaderSentenceAndHP() {
        let centerX = canvas.width / 2;

        // 1. 绘制句子背景框
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.strokeStyle = "#D90429";
        ctx.lineWidth = 3;
        let boxWidth = Math.min( canvas.width * 0.85, 320 );
        let boxHeight = 44;
        let boxX = centerX - boxWidth / 2;
        let boxY = 15;

        if (ctx.roundRect) {
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 12);
        } else {
            ctx.rect(boxX, boxY, boxWidth, boxHeight);
        }
        ctx.fill();
        ctx.stroke();

        // 2. 绘制题目文字
        ctx.fillStyle = "#1D3557";
        ctx.font = "bold 20px 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(currentDisplayPrompt, centerX, boxY + boxHeight / 2);
        ctx.restore();

        // 3. 绘制红心血条与连对进度提示
        ctx.save();
        let heartsText = "❤️".repeat(hp) + "🖤".repeat(maxHp - hp);
        ctx.font = "18px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(heartsText, 15, 80);

        // 连对进度小提示 (🔥 x1 / 🔥 x2)
        if (streak > 0) {
            ctx.fillStyle = "#FF4500";
            ctx.font = "bold 14px 'PingFang SC', sans-serif";
            ctx.fillText(`连对: ${streak}/3 🔥`, 15, 102);
        }

        ctx.fillStyle = "#FFF";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.font = "bold 20px 'Courier New', monospace";
        ctx.textAlign = "right";
        ctx.strokeText(`得分: ${score}`, canvas.width - 15, 80);
        ctx.fillText(`得分: ${score}`, canvas.width - 15, 80);
        ctx.restore();
    }

    function drawUI() {
        let centerX = canvas.width / 2;

        if (gameState !== "PLAYING") {
            drawMuteButton();
        }

        if (gameState === "SELECT") {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;

            ctx.font = "bold 26px Courier New";
            ctx.textAlign = "center";
            ctx.strokeText("SELECT CHARACTER", centerX, canvas.height * 0.18);
            ctx.fillText("SELECT CHARACTER", centerX, canvas.height * 0.18);

            let btnWidth = Math.min(230, canvas.width * 0.68);
            let btnHeight = 48;

            btnBoyRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.28, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#4EA8DE";
            ctx.fillRect(btnBoyRect.x, btnBoyRect.y, btnBoyRect.w, btnBoyRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnBoyRect.x, btnBoyRect.y, btnBoyRect.w, btnBoyRect.h);
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px Courier New";
            ctx.fillText("BOY MODE 👦", centerX, btnBoyRect.y + 30);

            btnGirlRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.40, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#FF85A1";
            ctx.fillRect(btnGirlRect.x, btnGirlRect.y, btnGirlRect.w, btnGirlRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.strokeRect(btnGirlRect.x, btnGirlRect.y, btnGirlRect.w, btnGirlRect.h);
            ctx.fillStyle = "#FFF";
            ctx.fillText("GIRL MODE 👧", centerX, btnGirlRect.y + 30);

            btnChineseRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.52, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#E63946";
            ctx.fillRect(btnChineseRect.x, btnChineseRect.y, btnChineseRect.w, btnChineseRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.strokeRect(btnChineseRect.x, btnChineseRect.y, btnChineseRect.w, btnChineseRect.h);
            ctx.fillStyle = "#FFF";
            ctx.fillText("CHINESE MODE 🧧", centerX, btnChineseRect.y + 30);

            btnMathRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.64, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#2A9D8F";
            ctx.fillRect(btnMathRect.x, btnMathRect.y, btnMathRect.w, btnMathRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.strokeRect(btnMathRect.x, btnMathRect.y, btnMathRect.w, btnMathRect.h);
            ctx.fillStyle = "#FFF";
            ctx.fillText("MATH MODE 📐", centerX, btnMathRect.y + 30);

        } else if (gameState === "START") {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;

            ctx.font = "bold 32px 'PingFang SC', sans-serif";
            ctx.textAlign = "center";
            ctx.strokeText("中文填空模式", centerX, canvas.height * 0.3);
            ctx.fillText("中文填空模式", centerX, canvas.height * 0.3);

            ctx.font = "18px 'PingFang SC', sans-serif";
            ctx.strokeText("长按/点击飞行，撞击正确的字！", centerX, canvas.height * 0.6);
            ctx.fillText("长按/点击飞行，撞击正确的字！", centerX, canvas.height * 0.6);

        } else if (gameState === "PLAYING") {
            drawHeaderSentenceAndHP();

        } else if (gameState === "GAMEOVER") {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;

            ctx.font = "bold 36px Courier New";
            ctx.textAlign = "center";
            ctx.strokeText("GAME OVER", centerX, canvas.height * 0.22);
            ctx.fillText("GAME OVER", centerX, canvas.height * 0.22);

            ctx.font = "bold 46px Courier New";
            ctx.strokeText(score, centerX, canvas.height * 0.34);
            ctx.fillText(score, centerX, canvas.height * 0.34);

            ctx.font = "20px Courier New";
            ctx.strokeText(`BEST: ${bestScore}`, centerX, canvas.height * 0.43);
            ctx.fillText(`BEST: ${bestScore}`, centerX, canvas.height * 0.43);

            let btnWidth = Math.min(220, canvas.width * 0.65);
            let btnHeight = 50;

            btnPlayAgainRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.52, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#73BF2E";
            ctx.fillRect(btnPlayAgainRect.x, btnPlayAgainRect.y, btnPlayAgainRect.w, btnPlayAgainRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnPlayAgainRect.x, btnPlayAgainRect.y, btnPlayAgainRect.w, btnPlayAgainRect.h);
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 20px Courier New";
            ctx.fillText("PLAY AGAIN", centerX, btnPlayAgainRect.y + 32);

            btnHomeRect = { x: centerX - btnWidth / 2, y: canvas.height * 0.64, w: btnWidth, h: btnHeight };
            ctx.fillStyle = "#E76F51";
            ctx.fillRect(btnHomeRect.x, btnHomeRect.y, btnHomeRect.w, btnHomeRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnHomeRect.x, btnHomeRect.y, btnHomeRect.w, btnHomeRect.h);
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 20px Courier New";
            ctx.fillText("HOME / SELECT", centerX, btnHomeRect.y + 32);
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        wordBubbles.update();
        wordBubbles.draw();

        fg.update();
        fg.draw();

        bird.update();
        bird.draw();

        drawUI();

        frames++;
        requestAnimationFrame(loop);
    }

    function isMuteButtonClicked(clickX, clickY) {
        return (
            clickX >= btnMuteRect.x && clickX <= btnMuteRect.x + btnMuteRect.w &&
            clickY >= btnMuteRect.y && clickY <= btnMuteRect.y + btnMuteRect.h
        );
    }

    function handleSelectClick(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;

        if (
            clickX >= btnChineseRect.x && clickX <= btnChineseRect.x + btnChineseRect.w &&
            clickY >= btnChineseRect.y && clickY <= btnChineseRect.y + btnChineseRect.h
        ) {
            selectedMode = 'chinese';
            gameState = "START";
            loadNextSentence();
            startBGM();
            return true;
        }

        if (
            (clickX >= btnBoyRect.x && clickX <= btnBoyRect.x + btnBoyRect.w && clickY >= btnBoyRect.y && clickY <= btnBoyRect.y + btnBoyRect.h) ||
            (clickX >= btnGirlRect.x && clickX <= btnGirlRect.x + btnGirlRect.w && clickY >= btnGirlRect.y && clickY <= btnGirlRect.y + btnGirlRect.h) ||
            (clickX >= btnMathRect.x && clickX <= btnMathRect.x + btnMathRect.w && clickY >= btnMathRect.y && clickY <= btnMathRect.y + btnMathRect.h)
        ) {
            selectedMode = 'chinese';
            gameState = "START";
            loadNextSentence();
            startBGM();
            return true;
        }

        return false;
    }

    function handleGameOverClick(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;

        if (
            clickX >= btnPlayAgainRect.x && clickX <= btnPlayAgainRect.x + btnPlayAgainRect.w &&
            clickY >= btnPlayAgainRect.y && clickY <= btnPlayAgainRect.y + btnPlayAgainRect.h
        ) {
            resetGame();
            return true;
        }

        if (
            clickX >= btnHomeRect.x && clickX <= btnHomeRect.x + btnHomeRect.w &&
            clickY >= btnHomeRect.y && clickY <= btnHomeRect.y + btnHomeRect.h
        ) {
            goToHome();
            return true;
        }

        return false;
    }

    function startAction(e) {
        initAudio();

        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        if (clientX !== undefined && clientY !== undefined) {
            const rect = canvas.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            if (isMuteButtonClicked(clickX, clickY)) {
                isMuted = !isMuted;
                return;
            }
        }

        if (gameState === "SELECT") {
            if (clientX !== undefined && clientY !== undefined) {
                handleSelectClick(clientX, clientY);
            }
            return;
        }

        if (gameState === "GAMEOVER") {
            if (clientX !== undefined && clientY !== undefined) {
                handleGameOverClick(clientX, clientY);
            }
            return;
        }

        startBGM();
        if (gameState === "START") {
            gameState = "PLAYING";
            isHolding = true;
            playJumpSound();
        } else if (gameState === "PLAYING") {
            isHolding = true;
            playJumpSound();
        }
    }

    function stopAction() {
        isHolding = false;
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            e.preventDefault();
            if (gameState === "SELECT") {
                selectedMode = 'chinese';
                gameState = "START";
                loadNextSentence();
                startBGM();
            } else if (gameState === "GAMEOVER") {
                resetGame();
            } else if (!e.repeat) {
                startAction(e);
            }
        } else if (e.code === "KeyM") {
            isMuted = !isMuted;
        }
    });
    window.addEventListener("keyup", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            stopAction();
        }
    });

    window.addEventListener("mousedown", startAction);
    window.addEventListener("mouseup", stopAction);

    window.addEventListener("touchstart", (e) => {
        if (e.cancelable) e.preventDefault();
        startAction(e);
    }, { passive: false });
    window.addEventListener("touchend", stopAction);
    window.addEventListener("touchcancel", stopAction);

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    function safeInit() {
        resizeCanvas();
        requestAnimationFrame(loop);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(safeInit, 100);
    } else {
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(safeInit, 100);
        });
    }
</script>
</body>
</html>
