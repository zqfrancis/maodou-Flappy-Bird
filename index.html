<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Bird - Choose Theme Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #70C5CE;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #debug-log {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            padding: 5px;
            z-index: 9999;
            display: none;
            word-break: break-all;
        }
        /* 数学模式语言选择下拉菜单样式 */
        #math-lang-select {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: none;
            background: #1D3557;
            color: #FFF;
            border: 2px solid #FFD166;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="birdCanvas"></canvas>
</div>

        try {
            const saved = localStorage.getItem("flappy_best_score_device");
            return saved !== null ? parseInt(saved, 10) || 0 : 0;
        } catch(e) {

        }

    // -------------------------------------------------------------
    // 标准小鸟的基础绘制代码（供后续各模式统一引用/扩展）
    // -------------------------------------------------------------
    function drawStandardBird(ctx, radius, frames, customBodyColor = "#F8D030") {
        // 1. 身体
        ctx.fillStyle = customBodyColor;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";
        ctx.stroke();

        // 2. 眼睛（白眼球）
        ctx.fillStyle = "#FFF";
        ctx.beginPath();
        ctx.arc(6, -6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 3. 瞳孔（黑眼珠）
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(8, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        // 4. 嘴巴
        ctx.fillStyle = "#F05A24";
        ctx.beginPath();
        ctx.arc(8, 4, 8, 0, Math.PI);
        ctx.fill();
        ctx.stroke();

        // 5. 翅膀
        ctx.fillStyle = customBodyColor === "#F8D030" ? "#E0C020" : "#FFB6C1";
        ctx.beginPath();
        let wingY = Math.sin(frames * 0.3) * 3;
        if (ctx.ellipse) {
            ctx.ellipse(-6, wingY, 7, 5, 0, 0, Math.PI * 2);
        } else {
            ctx.arc(-6, wingY, 6, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.stroke();
    }

    // 星空与精美背景装饰
    let stars = [];
