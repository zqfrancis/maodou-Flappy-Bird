    function generateStars() {
        stars = [];
        const count = 75;
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * (canvas.width || 300),
                y: Math.random() * ((canvas.height || 500) * 0.65),
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.01
            });
        }
    }

    function generateCandies() {
        candies = [];
        const colors = ['#FF70A6', '#FF9770', '#FFDC5E', '#A3E7FC', '#C8B6FF', '#B5EAD7'];
        for (let i = 0; i < 12; i++) {
            let typeRand = Math.random();
            let type = 'candy';
            if (typeRand < 0.35) {
                type = 'macaron';
            } else if (typeRand < 0.60) {
                type = 'lollipop';
            } else if (typeRand < 0.85) {
                type = 'candy';
            } else if (typeRand < 0.93) {
                type = 'bunny';
            } else {
                type = 'unicorn';
            }

            candies.push({
                x: Math.random() * (canvas.width || 300),
                y: Math.random() * ((canvas.height || 500) * 0.65),
                size: type === 'macaron' ? Math.random() * 4 + 10 : Math.random() * 6 + 10,
                type: type,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 0.25 + 0.1,
                floatOffset: Math.random() * Math.PI * 2
            });
        }
    }

    function isDaytime() {
        const hour = new Date().getHours();
        return hour >= 6 && hour < 18;
    }

    // 辅助求最大公约数
    function gcd(a, b) {
        return b === 0 ? a : gcd(b, a % b);
    }

    // 生成符合 G1-G7 阶梯维度的数学题
    function generateMathProblem(grade, mode) {
        let question = "";
        let answer = "";
        let wrong1 = "", wrong2 = "", wrong3 = "";
        let randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        if (mode === 'ADD_SUB') {
            let isAdd = Math.random() > 0.5;
            if (grade === 1) {
                if (isAdd) {
                    let a = randInt(1, 10), b = randInt(1, 10);
                    question = `${a} + ${b} = ?`;
                    let ans = a + b; answer = String(ans);
                    wrong1 = String(ans + randInt(1, 2)); wrong2 = String(Math.max(1, ans - randInt(1, 2))); wrong3 = String(ans + 3);
                } else {
                    let a = randInt(2, 10), b = randInt(1, a);
                    question = `${a} - ${b} = ?`;
                    let ans = a - b; answer = String(ans);
                    wrong1 = String(ans + 1); wrong2 = String(Math.max(0, ans - 1)); wrong3 = String(ans + 2);
                }
            } else if (grade === 2) {
                if (isAdd) {
                    let a = randInt(10, 50), b = randInt(10, 50);
                    question = `${a} + ${b} = ?`;
                    let ans = a + b; answer = String(ans);
                    wrong1 = String(ans + 10); wrong2 = String(ans - 5); wrong3 = String(ans + 2);
                } else {
                    let a = randInt(20, 99), b = randInt(10, a);
                    question = `${a} - ${b} = ?`;
                    let ans = a - b; answer = String(ans);
                    wrong1 = String(ans + 10); wrong2 = String(Math.max(1, ans - 5)); wrong3 = String(ans + 3);
                }
            } else if (grade <= 4) {
                let a = randInt(100, 500), b = randInt(50, 400);
                if (isAdd) {
                    question = `${a} + ${b} = ?`; answer = String(a + b);
                    wrong1 = String(a + b + 10); wrong2 = String(a + b - 10); wrong3 = String(a + b + 100);
                } else {
                    if (a < b) { let tmp = a; a = b; b = tmp; }
                    question = `${a} - ${b} = ?`; answer = String(a - b);
                    wrong1 = String(a - b + 10); wrong2 = String(Math.max(0, a - b - 10)); wrong3 = String(a - b + 5);
                }
            } else {
                let a = (randInt(100, 999) / 10).toFixed(1);
                let b = (randInt(100, 999) / 10).toFixed(1);
                let numA = parseFloat(a), numB = parseFloat(b);
                if (isAdd) {
                    question = `${a} + ${b} = ?`; answer = (numA + numB).toFixed(1);
                    wrong1 = (numA + numB + 1.1).toFixed(1); wrong2 = (numA + numB - 0.5).toFixed(1); wrong3 = (numA + numB + 2).toFixed(1);
                } else {
                    if (numA < numB) { let tmp = numA; numA = numB; numB = tmp; a = String(numA); b = String(numB); }
                    question = `${a} - ${b} = ?`; answer = (numA - numB).toFixed(1);
                    wrong1 = (numA - numB + 0.5).toFixed(1); wrong2 = Math.max(0, numA - numB - 0.2).toFixed(1); wrong3 = (numA - numB + 1.2).toFixed(1);
                }
            }
        } else if (mode === 'MUL_DIV') {
            let isMul = Math.random() > 0.5;
            if (grade <= 2) {
                let a = randInt(1, 5), b = randInt(1, 5);
                if (isMul) {
                    question = `${a} × ${b} = ?`; answer = String(a * b);
                    wrong1 = String(a * b + a); wrong2 = String(Math.max(1, a * b - 1)); wrong3 = String(a * b + 2);
                } else {
                    let ansVal = randInt(1, 5);
                    let prod = b * ansVal;
                    question = `${prod} ÷ ${b} = ?`; answer = String(ansVal);
                    wrong1 = String(ansVal + 1); wrong2 = String(Math.max(1, ansVal - 1)); wrong3 = String(ansVal + 2);
                }
            } else if (grade <= 4) {
                let a = randInt(2, 9), b = randInt(2, 9);
                if (isMul) {
                    question = `${a} × ${b} = ?`; answer = String(a * b);
                    wrong1 = String(a * b + a); wrong2 = String(Math.max(1, a * b - b)); wrong3 = String(a * b + 4);
                } else {
                    let ansVal = randInt(2, 9);
                    let prod = b * ansVal;
                    question = `${prod} ÷ ${b} = ?`; answer = String(ansVal);
                    wrong1 = String(ansVal + 1); wrong2 = String(Math.max(1, ansVal - 1)); wrong3 = String(ansVal + 2);
                }
            } else {
                if (isMul) {
                    let a = randInt(11, 25), b = randInt(3, 12);
                    question = `${a} × ${b} = ?`; answer = String(a * b);
                    wrong1 = String(a * b + 10); wrong2 = String(a * b - b); wrong3 = String(a * b + a);
                } else {
                    let b = randInt(4, 12), ansVal = randInt(11, 25);
                    let prod = b * ansVal;
                    question = `${prod} ÷ ${b} = ?`; answer = String(ansVal);
                    wrong1 = String(ansVal + 2); wrong2 = String(Math.max(1, ansVal - 2)); wrong3 = String(ansVal + 5);
                }
            }
        } else if (mode === 'FRAC') {
            if (grade <= 2) {
                let num1 = randInt(1, 3);
                question = `${num1}/4 + 1/4 = ?`;
                let ans = num1 + 1;
                answer = `${ans}/4`; wrong1 = `${ans + 1}/4`; wrong2 = `${Math.max(1, ans - 1)}/4`; wrong3 = `${ans}/5`;
            } else if (grade <= 4) {
                let den = randInt(3, 8);
                let num1 = randInt(1, den - 1);
                let num2 = randInt(1, den - num1);
                question = `${num1}/${den} + ${num2}/${den} = ?`;
                let sumNum = num1 + num2;
                answer = `${sumNum}/${den}`; wrong1 = `${sumNum + 1}/${den}`; wrong2 = `${Math.max(1, sumNum - 1)}/${den}`; wrong3 = `${sumNum}/${den + 1}`;
            } else {
                let den1 = 2, den2 = 4;
                if (Math.random() > 0.5) { den1 = 3; den2 = 6; }
                question = `1/${den1} + 1/${den2} = ?`;
                let g = gcd(den1 + den2, den1 * den2);
                let numAns = (den1 + den2) / g;
                let denAns = (den1 * den2) / g;
                answer = `${numAns}/${denAns}`;
                wrong1 = `2/${den1 + den2}`; wrong2 = `1/${den1 + den2}`; wrong3 = `${numAns + 1}/${denAns}`;
            }
        } else if (mode === 'GEO') {
            if (grade <= 2) {
                let type = randInt(1, 3);
                if (mathLang === 'zh') {
                    if (type === 1) { question = "三角形有几条边？"; answer = "3"; wrong1 = "4"; wrong2 = "5"; wrong3 = "6"; }
                    else if (type === 2) { question = "正方形有几条边？"; answer = "4"; wrong1 = "3"; wrong2 = "5"; wrong3 = "2"; }
                    else { question = "五边形有几条边？"; answer = "5"; wrong1 = "4"; wrong2 = "6"; wrong3 = "3"; }
                } else {
                    if (type === 1) { question = "Sides in a triangle?"; answer = "3"; wrong1 = "4"; wrong2 = "5"; wrong3 = "6"; }
                    else if (type === 2) { question = "Sides in a square?"; answer = "4"; wrong1 = "3"; wrong2 = "5"; wrong3 = "2"; }
                    else { question = "Sides in a pentagon?"; answer = "5"; wrong1 = "4"; wrong2 = "6"; wrong3 = "3"; }
                }
            } else if (grade <= 4) {
                let type = randInt(1, 2);
                if (type === 1) {
                    let side = randInt(2, 8);
                    question = mathLang === 'zh' ? `边长为${side}的正方形周长=?` : `Square perim. (side=${side})?`; 
                    answer = String(side * 4);
                    wrong1 = String(side * side); wrong2 = String(side * 2); wrong3 = String(side * 4 + 2);
                } else {
                    let w = randInt(2, 6), h = randInt(2, 6);
                    question = mathLang === 'zh' ? `长${w}宽${h}的长方形面积=?` : `Rect. area (${w}x${h})?`; 
                    answer = String(w * h);
                    wrong1 = String((w + h) * 2); wrong2 = String(w * h + 2); wrong3 = String(w + h);
                }
            } else {
                let type = randInt(1, 2);
                if (type === 1) {
                    let b = randInt(4, 10), h = randInt(2, 8);
                    if (h % 2 !== 0) h++;
                    question = mathLang === 'zh' ? `底${b}高${h}的三角形面积=?` : `Triangle area (b=${b}, h=${h})?`; 
                    answer = String((b * h) / 2);
                    wrong1 = String(b * h); wrong2 = String((b * h) / 2 + 2); wrong3 = String(b + h);
                } else {
                    let a = randInt(30, 80);
                    question = mathLang === 'zh' ? `直角三角形一锐角${a}°，另一角=?` : `Rt. tri. angle (${a}°), other=?`; 
                    answer = String(90 - a);
                    wrong1 = String(180 - a); wrong2 = String(90 + a); wrong3 = String(45);
                }
            }
        }

        let optionsSet = new Set([answer, wrong1, wrong2, wrong3]);
        let optArray = Array.from(optionsSet);
        while(optArray.length < 4) {
            optArray.push(String(randInt(1, 50)));
        }

        return {
            question: question,
            correctAnswer: answer,
            options: optArray
        };
    }

    function nextMathProblem() {
        currentMathProblem = generateMathProblem(selectedGrade, selectedMathSubMode);
        wrongAttemptsInCurrentMath = 0;
        floatingMathOptions = [];

        // 构建包含选项与独立暂停圆圈的对象数组
        let items = currentMathProblem.options.map(opt => ({
            text: opt,
            isCorrect: opt === currentMathProblem.correctAnswer,
            isPause: false
        }));
        
        // 增加一个独立的暂停圆圈，与答案圆圈同样大小
        items.push({
            text: "⏸️",
            isCorrect: false,
            isPause: true
        });

        // 随机打乱位置顺序
        items.sort(() => Math.random() - 0.5);

        let startX = canvas.width + 60;
        let gapX = Math.max(120, canvas.width * 0.28);

        for (let i = 0; i < items.length; i++) {
            let optY = playAreaHeight * 0.2 + Math.random() * (playAreaHeight * 0.6);
            floatingMathOptions.push({
                x: startX + i * gapX,
                y: optY,
                text: items[i].text,
                isCorrect: items[i].isCorrect,
                isPause: items[i].isPause,
                eaten: false,
                radius: 30
            });
        }
    }

    function resetCurrentMathOptions() {
        let startX = canvas.width + 60;
        let gapX = Math.max(120, canvas.width * 0.28);
        floatingMathOptions.sort(() => Math.random() - 0.5);

        for (let i = 0; i < floatingMathOptions.length; i++) {
            let optY = playAreaHeight * 0.2 + Math.random() * (playAreaHeight * 0.6);
            floatingMathOptions[i].x = startX + i * gapX;
            floatingMathOptions[i].y = optY;
            floatingMathOptions[i].eaten = false;
        }
    }

    function nextChineseIdiom() {
        currentIdiom = idiomBank[Math.floor(Math.random() * idiomBank.length)];
        wrongAttemptsInCurrentIdiom = 0; 
        floatingWords = [];
        let opts = [...currentIdiom.options].sort(() => Math.random() - 0.5);
        let startX = canvas.width + 50;
        let gapX = Math.max(140, canvas.width * 0.35);

        let targetChar = currentIdiom.chars[currentIdiom.missingIdx].char;

        for (let i = 0; i < opts.length; i++) {
            let wordY = playAreaHeight * 0.2 + Math.random() * (playAreaHeight * 0.6);
            floatingWords.push({
                x: startX + i * gapX,
                y: wordY,
                text: opts[i].char,
                pinyin: opts[i].pinyin,
                isCorrect: opts[i].char === targetChar,
                eaten: false,
                radius: 28
            });
        }
    }

    function resetCurrentFloatingWords() {
        let startX = canvas.width + 50;
        let gapX = Math.max(140, canvas.width * 0.35);
        floatingWords.sort(() => Math.random() - 0.5);

        for (let i = 0; i < floatingWords.length; i++) {
            let wordY = playAreaHeight * 0.2 + Math.random() * (playAreaHeight * 0.6);
            floatingWords[i].x = startX + i * gapX;
            floatingWords[i].y = wordY;
            floatingWords[i].eaten = false;
        }
    }

    function drawMacaron(size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.25, size, size * 0.55, 0, Math.PI, 0, true);
        ctx.fill();

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(-size * 0.9, -size * 0.25, size * 1.8, size * 0.3);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 0.05 * size, size, size * 0.55, 0, 0, Math.PI, false);
        ctx.fill();
    }

    function drawDoodleUnicorn(size, color) {
        ctx.strokeStyle = color || "#FFF";
        ctx.lineWidth = 1.5;
        ctx.fillStyle = "#FFF";

        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.8, size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#FFD166";
        ctx.beginPath();
        ctx.moveTo(size * 0.3, -size * 0.4);
        ctx.lineTo(size * 0.8, -size * 1.0);
        ctx.lineTo(size * 0.5, -size * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#4A4A4A";
        ctx.beginPath();
        ctx.arc(size * 0.3, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawDoodleBunny(size) {
        ctx.strokeStyle = "#FFB3C6";
        ctx.lineWidth = 1.5;
        ctx.fillStyle = "#FFFFFF";

        ctx.beginPath();
        ctx.ellipse(-size * 0.3, -size * 0.8, size * 0.2, size * 0.5, -0.1, 0, Math.PI * 2);
        ctx.ellipse(size * 0.3, -size * 0.8, size * 0.2, size * 0.5, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(-size * 0.25, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.arc(size * 0.25, -size * 0.1, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawCartoonSun(x, y, r) {
        ctx.save();
        ctx.translate(x, y);

        ctx.strokeStyle = "#FFB703";
        ctx.lineWidth = 3;
        const rayCount = 8;
        const rayRot = (frames * 0.01) % (Math.PI * 2);
        for (let i = 0; i < rayCount; i++) {
            let angle = rayRot + (i * Math.PI * 2) / rayCount;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * (r + 4), Math.sin(angle) * (r + 4));
            ctx.lineTo(Math.cos(angle) * (r + 12), Math.sin(angle) * (r + 12));
            ctx.stroke();
        }

        ctx.fillStyle = "#FFD166";
        ctx.strokeStyle = "#FB8500";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(-r * 0.3, -r * 0.1, 2.5, 0, Math.PI * 2);
        ctx.arc(r * 0.3, -r * 0.1, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 100, 100, 0.4)";
        ctx.beginPath();
        ctx.arc(-r * 0.45, r * 0.15, 3, 0, Math.PI * 2);
        ctx.arc(r * 0.45, r * 0.15, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, r * 0.05, r * 0.35, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.restore();
    }

    function drawFarmAnimals(baseY) {
        let animalSpeed = frames * 0.2;
        let wrapWidth = canvas.width + 100;

        let cowX = ((canvas.width + 50) - (animalSpeed % wrapWidth)) - 50;
        let cowY = baseY - 20;
        ctx.save();
        ctx.translate(cowX, cowY);
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-10, -8, 20, 12, 4);
        else ctx.rect(-10, -8, 20, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#333";
        ctx.beginPath();
        ctx.arc(-3, -3, 3, 0, Math.PI * 2);
        ctx.arc(4, 1, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(10, -6, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(12, -7, 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-7, 4); ctx.lineTo(-7, 9);
        ctx.moveTo(-2, 4); ctx.lineTo(-2, 9);
        ctx.moveTo(3, 4);  ctx.lineTo(3, 9);
        ctx.moveTo(7, 4);  ctx.lineTo(7, 9);
        ctx.stroke();
        ctx.restore();
    }

    function drawBackground() {
        if (selectedMode === 'chinese') {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, "#8B0000");
            bgGradient.addColorStop(0.5, "#B22222");
            bgGradient.addColorStop(1, "#D90429");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 215, 0, 0.15)";
            ctx.beginPath();
            ctx.moveTo(0, playAreaHeight);
            ctx.quadraticCurveTo(canvas.width * 0.25, playAreaHeight - 40, canvas.width * 0.5, playAreaHeight - 15);
            ctx.quadraticCurveTo(canvas.width * 0.75, playAreaHeight + 10, canvas.width, playAreaHeight - 30);
            ctx.lineTo(canvas.width, playAreaHeight);
            ctx.lineTo(0, playAreaHeight);
            ctx.fill();

        } else if (selectedMode === 'girl') {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, "#FFD6E0");
            bgGradient.addColorStop(0.5, "#FFEF96");
            bgGradient.addColorStop(1, "#FFC0D9");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 182, 193, 0.6)";
            ctx.beginPath();
            ctx.moveTo(0, playAreaHeight);
            ctx.quadraticCurveTo(canvas.width * 0.25, playAreaHeight - 45, canvas.width * 0.5, playAreaHeight - 20);
            ctx.quadraticCurveTo(canvas.width * 0.75, playAreaHeight + 10, canvas.width, playAreaHeight - 35);
            ctx.lineTo(canvas.width, playAreaHeight);
            ctx.lineTo(0, playAreaHeight);
            ctx.fill();

            for (let c of candies) {
                if (!isPaused) c.x -= c.speed;
                if (c.x < -40) c.x = canvas.width + 40;
                let floatY = c.y + Math.sin(frames * 0.03 + c.floatOffset) * 6;

                ctx.save();
                ctx.translate(c.x, floatY);

                if (c.type === 'macaron') {
                    drawMacaron(c.size, c.color);
                } else if (c.type === 'lollipop') {
                    ctx.strokeStyle = "#FFF";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, c.size * 1.2);
                    ctx.stroke();

                    ctx.fillStyle = c.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, c.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (c.type === 'bunny') {
                    drawDoodleBunny(c.size);
                } else if (c.type === 'unicorn') {
                    drawDoodleUnicorn(c.size, c.color);
                } else {
                    ctx.fillStyle = c.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, c.size, c.size * 0.55, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            let cloudOffset = (frames * 0.2) % (canvas.width + 200);
            drawCloud(canvas.width - cloudOffset, playAreaHeight * 0.25, 1);
            drawCloud(canvas.width * 1.5 - cloudOffset, playAreaHeight * 0.15, 0.8);

        } else if (selectedMode === 'math') {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, "#1D3557");
            bgGradient.addColorStop(0.5, "#457B9D");
            bgGradient.addColorStop(1, "#A8DADC");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let star of stars) {
                if (!isPaused) star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            const isDay = isDaytime();

            if (isDay) {
                ctx.fillStyle = "#70C5CE";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawCartoonSun(canvas.width * 0.82, playAreaHeight * 0.16, 22);

                ctx.fillStyle = "#A2D870";
                ctx.beginPath();
                ctx.moveTo(0, playAreaHeight);
                ctx.quadraticCurveTo(canvas.width * 0.25, playAreaHeight - 40, canvas.width * 0.5, playAreaHeight - 15);
                ctx.quadraticCurveTo(canvas.width * 0.75, playAreaHeight + 10, canvas.width, playAreaHeight - 30);
                ctx.lineTo(canvas.width, playAreaHeight);
                ctx.lineTo(0, playAreaHeight);
                ctx.fill();

                drawFarmAnimals(playAreaHeight - 5);
            } else {
                let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, "#0B132B");
                gradient.addColorStop(0.6, "#1C2541");
                gradient.addColorStop(1, "#3A506B");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 男孩模式专属云朵（在男孩模式下补充云朵渲染）
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            let cloudOffset1 = (frames * 0.3) % (canvas.width + 150);
            let cloudOffset2 = (frames * 0.2) % (canvas.width + 200);
            drawCloud(canvas.width - cloudOffset1, playAreaHeight * 0.2, 0.9);
            drawCloud(canvas.width * 1.4 - cloudOffset2, playAreaHeight * 0.12, 0.75);
        }
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.arc(15, -10, 22, 0, Math.PI * 2);
        ctx.arc(35, -5, 18, 0, Math.PI * 2);
        ctx.arc(45, 5, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    let audioCtx = null;
    let isMusicPlaying = false;
    let musicInterval = null;

    const melody = [
        261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
        293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
        261.63, 329.63, 392.00, 523.25, 659.25, 523.25,
        392.00, 349.23, 329.63, 293.66, 261.63, 196.00
    ];
    let noteIndex = 0;

    function initAudio() {
        if (!audioCtx) {
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
            } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(()=>{});
        }
    }

    function playNote(freq, duration, type = 'square', volume = 0.05) {
        if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playScoreSound() {
        playNote(523.25, 0.1, 'square', 0.08);
        setTimeout(() => playNote(659.25, 0.15, 'square', 0.08), 80);
    }

    function playWrongSound() {
        playNote(200, 0.15, 'sawtooth', 0.1);
        setTimeout(() => playNote(150, 0.2, 'sawtooth', 0.1), 100);
    }

    function playJumpSound() {
        if (isMuted || !audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function startBGM() {
        initAudio();
        if (isMusicPlaying) return; 
        
        stopBGM();
        isMusicPlaying = true;
        noteIndex = 0;

        musicInterval = setInterval(() => {
            if ((gameState === "PLAYING" || gameState === "START") && !isMuted && !isPaused) {
                let freq = melody[noteIndex];
                playNote(freq, 0.15, 'square', 0.04);
                noteIndex = (noteIndex + 1) % melody.length;
            }
        }, 180);
    }

    function stopBGM() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
        isMusicPlaying = false;
    }

    let groundHeight = 80;
    let playAreaHeight = 0;
    let baseSpeed = 2.5; 

    function getCurrentSpeed() {
        let multiplier = Math.pow(1.02, score); 
        return Math.min(baseSpeed * 3, baseSpeed * multiplier); 
    }

    function resizeCanvas() {
        const w = window.innerWidth || document.documentElement.clientWidth || 360;
        const h = window.innerHeight || document.documentElement.clientHeight || 640;
        
        canvas.width = w;
        canvas.height = h;
        
        groundHeight = Math.max(60, Math.floor(h * 0.12));
        playAreaHeight = h - groundHeight;

        baseSpeed = Math.max(2.5, w * 0.0038);

        generateStars();
        generateCandies();

        if (gameState === "START" || gameState === "SELECT" || gameState === "SELECT_GRADE") {
            bird.x = Math.min(100, w * 0.18);
            bird.y = playAreaHeight / 2;
        }
    }

    const bird = {
        x: 80,
        y: 300, 
        radius: 18,
        hitRadius: 15,
        gravity: 0.25,      
        thrust: -0.32,      
        maxSpeed: 5.5,      
        velocity: 0,
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.1));
            ctx.rotate(angle);

            // 中文模式下的红色尾巴（在小鸟身体下方/后方绘制）
            if (selectedMode === 'chinese') {
                let swing = Math.sin(frames * 0.15) * 4;
                ctx.fillStyle = "#E63946";
                ctx.strokeStyle = "#8B0000";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-12, -2);
                ctx.quadraticCurveTo(-22 + swing, -8, -26 + swing, -2);
                ctx.quadraticCurveTo(-22 + swing, 6, -12, 4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // 所有模式统一调用标准小鸟作为基底，女孩模式为粉色，其余模式为原色
            let bodyColor = (selectedMode === 'girl') ? "#FFC0CB" : "#F8D030";
            drawStandardBird(ctx, this.radius, frames, bodyColor);

            // 根据模式添加特定装扮
            if (selectedMode === 'boy') {
                // 男孩模式：黑色鸭舌帽
                ctx.fillStyle = "#1A1A1A";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;

                // 帽顶
                ctx.beginPath();
                ctx.arc(0, -12, 14, Math.PI, 0);
                ctx.fill();
                ctx.stroke();

                // 帽檐（朝右）
                ctx.beginPath();
                if (ctx.ellipse) {
                    ctx.ellipse(8, -12, 12, 4, 0.15, 0, Math.PI * 2);
                } else {
                    ctx.rect(0, -14, 18, 4);
                }
                ctx.fill();
                ctx.stroke();

            } else if (selectedMode === 'girl') {
                // 女孩模式：可爱发箍（粉色拱形 + 红色小蝴蝶结）
                ctx.strokeStyle = "#FF1493";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 1, Math.PI * 1.15, Math.PI * 1.85);
                ctx.stroke();

                // 顶端蝴蝶结
                ctx.fillStyle = "#FF1493";
                ctx.beginPath();
                ctx.ellipse(-4, -this.radius - 3, 5, 3, -Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(4, -this.radius - 3, 5, 3, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(0, -this.radius - 3, 2, 0, Math.PI * 2);
                ctx.fill();

            } else if (selectedMode === 'chinese') {
                // 中文模式：红色帽子
                ctx.fillStyle = "#D90429";
                ctx.strokeStyle = "#8B0000";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -10, 12, Math.PI, 0);
                ctx.fill();
                ctx.stroke();

                // 帽顶小黄球顶珠
                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.arc(0, -23, 3.5, 0, Math.PI * 2);
                ctx.fill();

            } else if (selectedMode === 'math') {
                // 数学模式：双框眼镜
                ctx.strokeStyle = "#1D3557";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(2, -11, 10, 10);
                ctx.strokeRect(-10, -11, 10, 10);
                ctx.beginPath();
                ctx.moveTo(2, -6);
                ctx.lineTo(0, -6);
                ctx.stroke();
            }

            ctx.restore();
        },

        update() {
            if (gameState === "PLAYING" && !isPaused) {
                if (isHolding) {
                    this.velocity += this.thrust;
                } else {
                    this.velocity += this.gravity;
                }

                this.velocity = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.velocity));
                this.y += this.velocity;

                if (this.y + this.hitRadius >= playAreaHeight) {
                    this.y = playAreaHeight - this.hitRadius;
                    gameOver();
                }
                if (this.y - this.hitRadius <= 0) {
                    this.y = this.hitRadius;
                    this.velocity = 0;
                }
            } else if (gameState === "START" || gameState === "SELECT" || gameState === "SELECT_GRADE") {
                this.y = (playAreaHeight / 2) + Math.sin(frames * 0.05) * 5;
            }
        },

        reset() {
            this.x = Math.min(100, canvas.width * 0.18);
            this.y = playAreaHeight / 2;
            this.velocity = 0;
        }
    };

    function drawSoftPipe(x, y, width, height, mainColor, accentColor, borderRadius = 12) {
        if (height <= 0) return;
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(x, y, width, height, borderRadius);
        } else {
            ctx.rect(x, y, width, height);
        }
        ctx.fill();

        ctx.fillStyle = accentColor;
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(x + 4, y, Math.max(2, width * 0.2), height, borderRadius / 2);
        } else {
            ctx.rect(x + 4, y, Math.max(2, width * 0.2), height);
        }
        ctx.fill();
    }

    const pipes = {
        items: [],
        baseGapPercent: 0.50, 
        minGapPercent: 0.18,  
        w: 60,                

        getCurrentGap() {
            let currentGapPercent = this.baseGapPercent * Math.pow(0.995, score);
            return canvas.height * Math.max(this.minGapPercent, currentGapPercent);
        },

        getDistanceBetweenPipes() {
            return Math.min(220, Math.max(170, canvas.width * 0.3));
        },

        draw() {
            if (selectedMode === 'chinese') {
                for (let w of floatingWords) {
                    if (w.eaten) continue;
                    ctx.save();
                    ctx.translate(w.x, w.y);

                    ctx.fillStyle = "#D90429";
                    ctx.beginPath();
                    ctx.arc(0, 0, w.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = "#FFD700";
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    if (showPinyin) {
                        ctx.fillStyle = "#FFE66D";
                        ctx.font = "bold 12px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(w.pinyin, 0, -13);

                        ctx.fillStyle = "#FFD700";
                        ctx.font = "bold 22px sans-serif";
                        ctx.fillText(w.text, 0, 8);
                    } else {
                        ctx.fillStyle = "#FFD700";
                        ctx.font = "bold 24px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(w.text, 0, 0);
                    }

                    ctx.restore();
                }
                return;
            }

            if (selectedMode === 'math') {
                // 绘制数学模式下的漂浮答案球与独立暂停球
                for (let opt of floatingMathOptions) {
                    if (opt.eaten) continue;
                    ctx.save();
                    ctx.translate(opt.x, opt.y);

                    if (opt.isPause) {
                        // 独立暂停圆圈球
                        ctx.fillStyle = isPaused ? "#E63946" : "#1D3557";
                        ctx.beginPath();
                        ctx.arc(0, 0, opt.radius, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = "#FFD166";
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.fillStyle = "#FFF";
                        ctx.font = "bold 20px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(isPaused ? "▶️" : "⏸️", 0, 0);
                    } else {
                        // 选项答案球
                        ctx.fillStyle = "#118AB2";
                        ctx.beginPath();
                        ctx.arc(0, 0, opt.radius, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = "#FFD166";
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.fillStyle = "#FFF";
                        ctx.font = "bold 18px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(opt.text, 0, 0);
                    }

                    ctx.restore();
                }
                return;
            }

            for (let p of this.items) {
                if (selectedMode === 'girl') {
                    let pipeMain = "#C8B6FF";
                    let pipeAccent = "#E7C6FF";
                    let capMain = "#FFB5A7";

                    drawSoftPipe(p.x, 0, this.w, p.top, pipeMain, pipeAccent, 10);
                    ctx.fillStyle = capMain;
                    ctx.strokeStyle = "#FFF";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(p.x - 5, p.top - 22, this.w + 10, 22, 10);
                    } else {
                        ctx.rect(p.x - 5, p.top - 22, this.w + 10, 22);
                    }
                    ctx.fill();
                    ctx.stroke();

                    let bottomY = p.top + p.gap;
                    let bottomHeight = playAreaHeight - bottomY;
                    drawSoftPipe(p.x, bottomY, this.w, bottomHeight, pipeMain, pipeAccent, 10);
                    ctx.fillStyle = capMain;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(p.x - 5, bottomY, this.w + 10, 22, 10);
                    } else {
                        ctx.rect(p.x - 5, bottomY, this.w + 10, 22);
                    }
                    ctx.fill();
                    ctx.stroke();

                } else {
                    ctx.fillStyle = "#73BF2E";
                    ctx.fillRect(p.x, 0, this.w, p.top);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, 0, this.w, p.top);

                    ctx.fillRect(p.x - 4, p.top - 20, this.w + 8, 20);
                    ctx.strokeRect(p.x - 4, p.top - 20, this.w + 8, 20);

                    let bottomY = p.top + p.gap;
                    let bottomHeight = playAreaHeight - bottomY;
                    ctx.fillRect(p.x, bottomY, this.w, bottomHeight);
                    ctx.strokeRect(p.x, bottomY, this.w, bottomHeight);

                    ctx.fillRect(p.x - 4, bottomY, this.w + 8, 20);
                    ctx.strokeRect(p.x - 4, bottomY, this.w + 8, 20);
                }
            }
        },

        update() {
            if (gameState !== "PLAYING" || isPaused) return;

            let currentSpeed = getCurrentSpeed(); 

            if (selectedMode === 'chinese') {
                let allOutOrEaten = true;
                for (let w of floatingWords) {
                    if (!w.eaten) {
                        w.x -= currentSpeed;

                        let dx = bird.x - w.x;
                        let dy = bird.y - w.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < bird.hitRadius + w.radius) {
                            w.eaten = true;
                            if (w.isCorrect) {
                                score++;
                                consecutiveCorrect++;
                                if (score > bestScore) {
                                    bestScore = score;
                                    setSafeBestScore(bestScore);
                                }
                                playScoreSound();
                                if (consecutiveCorrect >= 3) {
                                    if (chineseLives < 5) {
                                        chineseLives++;
                                        feedbackText = "回血 +1 ❤️";
                                        feedbackTimer = 60;
                                    }
                                    consecutiveCorrect = 0;
                                } else {
                                    feedbackText = "正确! +" + consecutiveCorrect;
                                    feedbackTimer = 40;
                                }
                                nextChineseIdiom();
                                break;
                            } else {
                                chineseLives--;
                                consecutiveCorrect = 0;
                                wrongAttemptsInCurrentIdiom++;
                                playWrongSound();

                                if (chineseLives <= 0) {
                                    feedbackText = "答错 -1 ❤️";
                                    feedbackTimer = 60;
                                    gameOver();
                                } else {
                                    if (wrongAttemptsInCurrentIdiom >= 3) {
                                        feedbackText = "已错3次，换一题";
                                        feedbackTimer = 60;
                                        nextChineseIdiom();
                                    } else {
                                        let leftTries = 3 - wrongAttemptsInCurrentIdiom;
                                        feedbackText = `答错 -1 ❤️ (还剩${leftTries}次机会)`;
                                        feedbackTimer = 60;
                                        resetCurrentFloatingWords();
                                    }
                                }
                                break;
                            }
                        }

                        if (w.x + w.radius > 0) {
                            allOutOrEaten = false;
                        }
                    }
                }

                if (allOutOrEaten && floatingWords.length > 0) {
                    resetCurrentFloatingWords();
                }
                return;
            }

            if (selectedMode === 'math') {
                let allOutOrEaten = true;
                for (let opt of floatingMathOptions) {
                    if (!opt.eaten) {
                        opt.x -= currentSpeed;

                        let dx = bird.x - opt.x;
                        let dy = bird.y - opt.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < bird.hitRadius + opt.radius) {
                            if (opt.isPause) {
                                // 撞击独立的暂停圆圈，切换暂停状态
                                isPaused = !isPaused;
                                opt.eaten = true;
                                break;
                            } else {
                                opt.eaten = true;
                                if (opt.isCorrect) {
                                    score++;
                                    if (score > bestScore) {
                                        bestScore = score;
                                        setSafeBestScore(bestScore);
                                    }
                                    playScoreSound();
                                    feedbackText = mathLang === 'zh' ? "答对了！🎉" : "Correct! 🎉";
                                    feedbackTimer = 40;
                                    nextMathProblem();
                                    break;
                                } else {
                                    mathLives--;
                                    wrongAttemptsInCurrentMath++;
                                    playWrongSound();

                                    if (mathLives <= 0) {
                                        feedbackText = mathLang === 'zh' ? "答错 ❌ 游戏结束" : "Wrong ❌ Game Over";
                                        feedbackTimer = 60;
                                        gameOver();
                                    } else {
                                        feedbackText = mathLang === 'zh' ? `答错 ❌ (还剩${mathLives}次机会)` : `Wrong ❌ (${mathLives} left)`;
                                        feedbackTimer = 60;
                                        resetCurrentMathOptions();
                                    }
                                    break;
                                }
                            }
                        }

                        if (opt.x + opt.radius > 0) {
                            allOutOrEaten = false;
                        }
                    }
                }

                if (allOutOrEaten && floatingMathOptions.length > 0) {
                    resetCurrentMathOptions();
                }
                return;
            }

            let distance = this.getDistanceBetweenPipes();
            let lastPipe = this.items[this.items.length - 1];

            if (!lastPipe || (canvas.width - lastPipe.x >= distance)) {
                let currentGap = this.getCurrentGap();
                let absoluteMinTop = playAreaHeight * 0.1;
                let absoluteMaxTop = playAreaHeight - currentGap - playAreaHeight * 0.1;

                let top = Math.floor(Math.random() * (absoluteMaxTop - absoluteMinTop + 1)) + absoluteMinTop;
                let pipeObj = { x: canvas.width, top: top, gap: currentGap, passed: false };
                this.items.push(pipeObj);
            }

            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= currentSpeed; 

                if (!p.passed && bird.x > p.x + this.w) {
                    score++;
                    p.passed = true;
                    playScoreSound();
                    if (score > bestScore) {
                        bestScore = score;
                        setSafeBestScore(bestScore);
                    }
                }

                if (
                    bird.x + bird.hitRadius > p.x && 
                    bird.x - bird.hitRadius < p.x + this.w && 
                    (bird.y - bird.hitRadius < p.top || bird.y + bird.hitRadius > p.top + p.gap)
                ) {
                    gameOver();
                }

                if (p.x + this.w < 0) {
                    this.items.splice(i, 1);
                    i--;
                }
            }
        },

        reset() {
            this.items = [];
        }
    };

    const fg = {
        x: 0,
        draw() {
            if (selectedMode === 'chinese') {
                ctx.fillStyle = "#8B0000";
                ctx.fillRect(0, playAreaHeight, canvas.width, groundHeight);
                ctx.fillStyle = "#FFD700";
                ctx.fillRect(0, playAreaHeight, canvas.width, 10);
            } else if (selectedMode === 'girl') {
                ctx.fillStyle = "#FFCAD4";
                ctx.fillRect(0, playAreaHeight, canvas.width, groundHeight);
                ctx.fillStyle = "#FFF";
                ctx.fillRect(0, playAreaHeight, canvas.width, 14);
            } else {
                ctx.fillStyle = "#DDD894";
                ctx.fillRect(0, playAreaHeight, canvas.width, groundHeight);
                ctx.fillStyle = "#73BF2E";
                ctx.fillRect(0, playAreaHeight, canvas.width, 14);
            }
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, playAreaHeight);
            ctx.lineTo(canvas.width, playAreaHeight);
            ctx.stroke();
        },
        update() {
            if (gameState === "PLAYING" && !isPaused) {
                this.x = (this.x - getCurrentSpeed()) % 20;
            }
        }
    };

    function gameOver() {
        gameState = "GAMEOVER";
        isPaused = false;
        isHolding = false;
        stopBGM();
        if (audioCtx) playNote(120, 0.4, 'sawtooth', 0.1);
    }

    function resetGame() {
        bird.reset();
        pipes.reset();
        score = 0;
        frames = 0;
        chineseLives = 5;
        mathLives = 3;
        isPaused = false;
        consecutiveCorrect = 0;
        feedbackText = "";
        wrongAttemptsInCurrentIdiom = 0;
        wrongAttemptsInCurrentMath = 0;
        if (selectedMode === 'chinese') {
            nextChineseIdiom();
        } else if (selectedMode === 'math') {
            nextMathProblem();
        }
        gameState = "PLAYING";
        startBGM();
    }

    function goToHome() {
        bird.reset();
        pipes.reset();
        score = 0;
        frames = 0;
        selectedMode = null;
        isPaused = false;
        gameState = "SELECT";
        stopBGM();
    }

    // UI 按钮矩形框
    let btnBoyRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnGirlRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnChineseRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnPinyinToggleRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnMathRect = { x: 0, y: 0, w: 0, h: 0 };

    let btnGradeRects = [];
    let btnGradeBackRect = { x: 0, y: 0, w: 0, h: 0 };

    let btnMathSubRects = [];

    let btnPlayAgainRect = { x: 0, y: 0, w: 0, h: 0 };
    let btnHomeRect = { x: 0, y: 0, w: 0, h: 0 };

    function drawMuteButton() {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(btnMuteRect.x, btnMuteRect.y, btnMuteRect.w, btnMuteRect.h, 10);
        } else {
            ctx.rect(btnMuteRect.x, btnMuteRect.y, btnMuteRect.w, btnMuteRect.h);
        }
        ctx.fill();

        ctx.strokeStyle = "#FFF";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
            isMuted ? "🔇" : "🔊", 
            btnMuteRect.x + btnMuteRect.w / 2, 
            btnMuteRect.y + btnMuteRect.h / 2 + 1
        );
        ctx.restore();
    }

    function updateLanguageDropdownVisibility() {
        // 仅在进入数学模式之后显示顶部语言下拉菜单
        if (selectedMode === 'math') {
            mathLangSelect.style.display = "block";
        } else {
            mathLangSelect.style.display = "none";
        }
    }

    function drawUI() {
        let centerX = canvas.width / 2;

        updateLanguageDropdownVisibility();
        drawMuteButton();

        if (gameState === "SELECT") {
            let totalBtnWidth = Math.min(280, canvas.width * 0.82);
            let btnHeight = 48;

            // 1. BOY MODE
            btnBoyRect = {
                x: centerX - totalBtnWidth / 2,
                y: canvas.height * 0.28,
                w: totalBtnWidth,
                h: btnHeight
            };
            ctx.fillStyle = "#4EA8DE";
            ctx.fillRect(btnBoyRect.x, btnBoyRect.y, btnBoyRect.w, btnBoyRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnBoyRect.x, btnBoyRect.y, btnBoyRect.w, btnBoyRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px Courier New";
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.fillText("BOY MODE 👦", centerX, btnBoyRect.y + 30);

            // 2. GIRL MODE
            btnGirlRect = {
                x: centerX - totalBtnWidth / 2,
                y: canvas.height * 0.40,
                w: totalBtnWidth,
                h: btnHeight
            };
            ctx.fillStyle = "#FF85A1";
            ctx.fillRect(btnGirlRect.x, btnGirlRect.y, btnGirlRect.w, btnGirlRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnGirlRect.x, btnGirlRect.y, btnGirlRect.w, btnGirlRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px Courier New";
            ctx.fillText("GIRL MODE 👧", centerX, btnGirlRect.y + 30);

            // 3. 中文模式
            let rowX = centerX - totalBtnWidth / 2;
            let rowY = canvas.height * 0.52;

            btnChineseRect = {
                x: rowX,
                y: rowY,
                w: totalBtnWidth,
                h: btnHeight
            };
            ctx.fillStyle = "#E63946";
            ctx.fillRect(btnChineseRect.x, btnChineseRect.y, btnChineseRect.w, btnChineseRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnChineseRect.x, btnChineseRect.y, btnChineseRect.w, btnChineseRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("中文模式 🧧", btnChineseRect.x + btnChineseRect.w / 2 - 25, btnChineseRect.y + 30);

            let toggleMargin = 4;
            let toggleWidth = 60;
            let toggleHeight = btnHeight - toggleMargin * 2;

            btnPinyinToggleRect = {
                x: rowX + totalBtnWidth - toggleWidth - toggleMargin,
                y: rowY + toggleMargin,
                w: toggleWidth,
                h: toggleHeight
            };
            ctx.fillStyle = showPinyin ? "#FFB703" : "#6C757D";
            ctx.fillRect(btnPinyinToggleRect.x, btnPinyinToggleRect.y, btnPinyinToggleRect.w, btnPinyinToggleRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(btnPinyinToggleRect.x, btnPinyinToggleRect.y, btnPinyinToggleRect.w, btnPinyinToggleRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(showPinyin ? "拼音:有" : "拼音:无", btnPinyinToggleRect.x + btnPinyinToggleRect.w / 2, btnPinyinToggleRect.y + 24);

            // 4. MATH MODE
            btnMathRect = {
                x: centerX - totalBtnWidth / 2,
                y: canvas.height * 0.64,
                w: totalBtnWidth,
                h: btnHeight
            };
            ctx.fillStyle = "#2A9D8F";
            ctx.fillRect(btnMathRect.x, btnMathRect.y, btnMathRect.w, btnMathRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(btnMathRect.x, btnMathRect.y, btnMathRect.w, btnMathRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px Courier New";
            ctx.fillText("MATH MODE 📐", centerX, btnMathRect.y + 30);

        } else if (gameState === "SELECT_GRADE") {
            ctx.save();
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 24px Courier New";
            ctx.textAlign = "center";
            ctx.fillText(mathLang === 'zh' ? "选择年级 (1-7)" : "SELECT GRADE (1-7)", centerX, canvas.height * 0.22);

            btnGradeRects = [];
            let startY = canvas.height * 0.28;
            let btnW = Math.min(220, canvas.width * 0.7);
            let btnH = 38;
            let gapY = 46;

            for (let g = 1; g <= 7; g++) {
                let rect = {
                    x: centerX - btnW / 2,
                    y: startY + (g - 1) * gapY,
                    w: btnW,
                    h: btnH,
                    grade: g
                };
                btnGradeRects.push(rect);

                ctx.fillStyle = "#1D3557";
                ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                ctx.strokeStyle = "#457B9D";
                ctx.lineWidth = 2;
                ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

                ctx.fillStyle = "#FFF";
                ctx.font = "bold 16px Courier New";
                ctx.textBaseline = "middle";
                ctx.fillText(mathLang === 'zh' ? `${g} 年级` : `Grade ${g}`, centerX, rect.y + rect.h / 2);
            }

            btnGradeBackRect = {
                x: centerX - btnW / 2,
                y: startY + 7 * gapY,
                w: btnW,
                h: btnH
            };
            ctx.fillStyle = "#E63946";
            ctx.fillRect(btnGradeBackRect.x, btnGradeBackRect.y, btnGradeBackRect.w, btnGradeBackRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(btnGradeBackRect.x, btnGradeBackRect.y, btnGradeBackRect.w, btnGradeBackRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 16px Courier New";
            ctx.fillText(mathLang === 'zh' ? "返回 🏠" : "BACK 🏠", centerX, btnGradeBackRect.y + btnGradeBackRect.h / 2);

            ctx.restore();

        } else if (gameState === "START") {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;

            ctx.font = "bold 32px Courier New";
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.strokeText("Flappy Bird", centerX, canvas.height * 0.22);
            ctx.fillText("Flappy Bird", centerX, canvas.height * 0.22);

            if (selectedMode === 'math') {
                ctx.fillStyle = "#FFD166";
                ctx.font = "bold 18px Courier New";
                ctx.fillText(mathLang === 'zh' ? `[ ${selectedGrade} 年级 ]` : `[ Grade ${selectedGrade} ]`, centerX, canvas.height * 0.28);

                btnMathSubRects = [];
                let modes = mathLang === 'zh' ? [
                    { key: 'ADD_SUB', label: "➕➖ 加减法" },
                    { key: 'MUL_DIV', label: "✖️➗ 乘除法" },
                    { key: 'FRAC', label: "½ 分数" },
                    { key: 'GEO', label: "📐 几何" }
                ] : [
                    { key: 'ADD_SUB', label: "➕➖ Add / Sub" },
                    { key: 'MUL_DIV', label: "✖️➗ Mul / Div" },
                    { key: 'FRAC', label: "½ Fraction" },
                    { key: 'GEO', label: "📐 Geometry" }
                ];

                let bw = Math.min(220, canvas.width * 0.7);
                let bh = 38;
                let startY = canvas.height * 0.35;

                modes.forEach((m, idx) => {
                    let r = {
                        x: centerX - bw / 2,
                        y: startY + idx * 48,
                        w: bw,
                        h: bh,
                        mode: m.key
                    };
                    btnMathSubRects.push(r);

                    ctx.fillStyle = selectedMathSubMode === m.key ? "#06D6A0" : "#118AB2";
                    ctx.fillRect(r.x, r.y, r.w, r.h);
                    ctx.strokeStyle = "#FFF";
                    ctx.lineWidth = selectedMathSubMode === m.key ? 3 : 1.5;
                    ctx.strokeRect(r.x, r.y, r.w, r.h);

                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 14px sans-serif";
                    ctx.textBaseline = "middle";
                    ctx.fillText(m.label, centerX, r.y + r.h / 2);
                });

                ctx.fillStyle = "#FFF";
                ctx.font = "bold 16px Courier New";
                ctx.textBaseline = "alphabetic";
                let flyTip = mathLang === 'zh' ? "按住飞行" : "HOLD TO FLY";
                ctx.strokeText(flyTip, centerX, canvas.height * 0.85);
                ctx.fillText(flyTip, centerX, canvas.height * 0.85);

            } else {
                ctx.font = "18px Courier New";
                ctx.strokeText("HOLD TO FLY", centerX, canvas.height * 0.6);
                ctx.fillText("HOLD TO FLY", centerX, canvas.height * 0.6);
            }

        } else if (gameState === "PLAYING") {
            if (selectedMode === 'chinese') {
                ctx.fillStyle = "#FFD700";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "left";
                ctx.textBaseline = "alphabetic";
                ctx.fillText(`得分: ${score}`, 15, 80);

                let hearts = "";
                for (let i = 0; i < 5; i++) {
                    hearts += i < chineseLives ? "❤️" : "🖤";
                }
                ctx.font = "18px sans-serif";
                ctx.fillText(`血量: ${hearts}`, 15, 110);

                if (currentIdiom) {
                    ctx.save();
                    let totalChars = currentIdiom.chars.length;
                    let charSpacing = 32;
                    let startX = centerX - ((totalChars - 1) * charSpacing) / 2;

                    for (let i = 0; i < totalChars; i++) {
                        let curX = startX + i * charSpacing;
                        let item = currentIdiom.chars[i];

                        if (i === currentIdiom.missingIdx) {
                            ctx.fillStyle = "#FFE66D";
                            ctx.font = "bold 26px sans-serif";
                            ctx.textAlign = "center";
                            ctx.fillText("？", curX, 45);
                        } else {
                            if (showPinyin) {
                                ctx.fillStyle = "#FFFFFF";
                                ctx.font = "bold 12px sans-serif";
                                ctx.textAlign = "center";
                                ctx.fillText(item.pinyin, curX, 28);

                                ctx.fillStyle = "#FFD700";
                                ctx.font = "bold 22px sans-serif";
                                ctx.fillText(item.char, curX, 50);
                            } else {
                                ctx.fillStyle = "#FFD700";
                                ctx.font = "bold 24px sans-serif";
                                ctx.textAlign = "center";
                                ctx.fillText(item.char, curX, 45);
                            }
                        }
                    }
                    ctx.restore();
                }

                if (feedbackTimer > 0) {
                    ctx.save();
                    ctx.fillStyle = feedbackText.includes("正确") || feedbackText.includes("回血") ? "#4EDA59" : "#FF4D4D";
                    ctx.font = "bold 20px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, centerX, playAreaHeight * 0.25);
                    ctx.restore();
                    feedbackTimer--;
                }

            } else if (selectedMode === 'math') {
                // 数学模式 UI：顶部出题 + 3次机会血量 + 得分
                ctx.fillStyle = "#FFD166";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "left";
                ctx.textBaseline = "alphabetic";
                ctx.fillText(mathLang === 'zh' ? `得分: ${score}` : `Score: ${score}`, 15, 80);

                let mathHearts = "";
                for (let i = 0; i < 3; i++) {
                    mathHearts += i < mathLives ? "❤️" : "🖤";
                }
                ctx.font = "16px sans-serif";
                ctx.fillText(mathLang === 'zh' ? `机会: ${mathHearts}` : `Lives: ${mathHearts}`, 15, 108);

                // 顶部数学题目框
                if (currentMathProblem) {
                    ctx.save();
                    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                    let probBoxW = Math.min(280, canvas.width * 0.75);
                    let probBoxH = 45;
                    let topY = 55; // 稍微向下偏移避开顶部下拉选择框
                    if (ctx.roundRect) {
                        ctx.roundRect(centerX - probBoxW / 2, topY, probBoxW, probBoxH, 10);
                    } else {
                        ctx.rect(centerX - probBoxW / 2, topY, probBoxW, probBoxH);
                    }
                    ctx.fill();

                    ctx.strokeStyle = "#06D6A0";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = "#FFD166";
                    ctx.font = "bold 22px Courier New";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(currentMathProblem.question, centerX, topY + 23);
                    ctx.restore();
                }

                // 暂停指示
                if (isPaused) {
                    ctx.save();
                    ctx.fillStyle = "#E63946";
                    ctx.font = "bold 20px sans-serif";
                    ctx.textAlign = "center";
                    let pauseTip = mathLang === 'zh' ? "⏸️ 思考暂停中 (点击屏幕或撞击▶️继续)" : "⏸️ PAUSED (Tap screen or hit ▶️ to continue)";
                    ctx.fillText(pauseTip, centerX, playAreaHeight * 0.25);
                    ctx.restore();
                }

                if (feedbackTimer > 0) {
                    ctx.save();
                    ctx.fillStyle = feedbackText.includes("Correct") || feedbackText.includes("答对了") ? "#4EDA59" : "#FF4D4D";
                    ctx.font = "bold 20px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(feedbackText, centerX, playAreaHeight * 0.30);
                    ctx.restore();
                    feedbackTimer--;
                }

            } else {
                ctx.fillStyle = "#FFF";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 3;

                ctx.font = "bold 40px Courier New";
                ctx.textAlign = "center";
                ctx.textBaseline = "alphabetic";
                ctx.strokeText(score, centerX, 80);
                ctx.fillText(score, centerX, 80);
            }

        } else if (gameState === "GAMEOVER") {
            ctx.save();
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let panelWidth = Math.min(280, canvas.width * 0.82);
            let panelHeight = 220;
            let panelX = centerX - panelWidth / 2;
            let panelY = canvas.height * 0.28;

            ctx.fillStyle = "#DED895";
            ctx.fillRect(panelX, panelY, panelWidth, panelHeight);
            ctx.strokeStyle = "#543847";
            ctx.lineWidth = 4;
            ctx.strokeRect(panelX, panelY, panelWidth, panelHeight);

            ctx.fillStyle = "#E86100";
            ctx.font = "bold 24px Courier New";
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.fillText("GAME OVER", centerX, panelY + 40);

            ctx.fillStyle = "#543847";
            ctx.font = "18px Courier New";
            ctx.fillText("SCORE: " + score, centerX, panelY + 80);
            ctx.fillText("BEST: " + bestScore, centerX, panelY + 115);

            let btnW = (panelWidth - 30) / 2;
            let btnH = 40;
            let btnY = panelY + panelHeight - 55;

            btnPlayAgainRect = { x: panelX + 10, y: btnY, w: btnW, h: btnH };
            ctx.fillStyle = "#73BF2E";
            ctx.fillRect(btnPlayAgainRect.x, btnPlayAgainRect.y, btnPlayAgainRect.w, btnPlayAgainRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(btnPlayAgainRect.x, btnPlayAgainRect.y, btnPlayAgainRect.w, btnPlayAgainRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 14px Courier New";
            ctx.fillText("AGAIN 🔄", btnPlayAgainRect.x + btnW / 2, btnY + 25);

            btnHomeRect = { x: panelX + panelWidth - btnW - 10, y: btnY, w: btnW, h: btnH };
            ctx.fillStyle = "#E63946";
            ctx.fillRect(btnHomeRect.x, btnHomeRect.y, btnHomeRect.w, btnHomeRect.h);
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 2;
            ctx.strokeRect(btnHomeRect.x, btnHomeRect.y, btnHomeRect.w, btnHomeRect.h);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 14px Courier New";
            ctx.fillText("HOME 🏠", btnHomeRect.x + btnW / 2, btnY + 25);

            ctx.restore();
        }
    }

    function isInside(pos, rect) {
        return pos.x >= rect.x && pos.x <= rect.x + rect.w &&
               pos.y >= rect.y && pos.y <= rect.y + rect.h;
    }

    function handleStart(x, y) {
        initAudio();
        const pos = { x, y };

        if (isInside(pos, btnMuteRect)) {
            isMuted = !isMuted;
            if (isMuted) stopBGM();
            else startBGM();
            return;
        }

        if (gameState === "SELECT") {
            if (isInside(pos, btnPinyinToggleRect)) {
                showPinyin = !showPinyin;
                return;
            }
            if (isInside(pos, btnBoyRect)) {
                selectedMode = 'boy';
                gameState = "START";
                startBGM();
                return;
            }
            if (isInside(pos, btnGirlRect)) {
                selectedMode = 'girl';
                gameState = "START";
                startBGM();
                return;
            }
            if (isInside(pos, btnChineseRect)) {
                selectedMode = 'chinese';
                gameState = "START";
                startBGM();
                return;
            }
            if (isInside(pos, btnMathRect)) {
                selectedMode = 'math';
                gameState = "SELECT_GRADE";
                return;
            }
        } else if (gameState === "SELECT_GRADE") {
            for (let r of btnGradeRects) {
                if (isInside(pos, r)) {
                    selectedGrade = r.grade;
                    gameState = "START";
                    startBGM();
                    return;
                }
            }
            if (isInside(pos, btnGradeBackRect)) {
                gameState = "SELECT";
                return;
            }
        } else if (gameState === "START") {
            if (selectedMode === 'math') {
                for (let r of btnMathSubRects) {
                    if (isInside(pos, r)) {
                        selectedMathSubMode = r.mode;
                        return;
                    }
                }
            }
            gameState = "PLAYING";
            isHolding = true;
            bird.velocity = bird.thrust * 8;
            playJumpSound();
            if (selectedMode === 'chinese' && (!floatingWords || floatingWords.length === 0)) {
                nextChineseIdiom();
            } else if (selectedMode === 'math' && (!floatingMathOptions || floatingMathOptions.length === 0)) {
                nextMathProblem();
            }
        } else if (gameState === "PLAYING") {
            // 如果处于暂停状态，点击屏幕任意位置解除暂停并让小鸟跳跃继续
            if (isPaused) {
                isPaused = false;
            }
            isHolding = true;
            playJumpSound();
        } else if (gameState === "GAMEOVER") {
            if (isInside(pos, btnPlayAgainRect)) {
                resetGame();
            } else if (isInside(pos, btnHomeRect)) {
                goToHome();
            }
        }
    }

    function stopAction() {
        isHolding = false;
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            if (gameState === "PLAYING") {
                if (isPaused) {
                    isPaused = false;
                }
                isHolding = true;
                playJumpSound();
            } else if (gameState === "START") {
                gameState = "PLAYING";
                isHolding = true;
                bird.velocity = bird.thrust * 8;
                playJumpSound();
                if (selectedMode === 'chinese' && (!floatingWords || floatingWords.length === 0)) {
                    nextChineseIdiom();
                } else if (selectedMode === 'math' && (!floatingMathOptions || floatingMathOptions.length === 0)) {
                    nextMathProblem();
                }
            } else if (gameState === "GAMEOVER") {
                resetGame();
            }
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            stopAction();
        }
    });

    window.addEventListener("mousedown", (e) => {
        // 如果点击的是下拉框选择器，不触发游戏点击操作
        if (e.target === mathLangSelect) return;
        handleStart(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", stopAction);

    window.addEventListener("touchstart", (e) => {
        if (e.target === mathLangSelect) return;
        if (e.cancelable) e.preventDefault();
        if (e.touches && e.touches.length > 0) {
            handleStart(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    window.addEventListener("touchend", stopAction);
    window.addEventListener("touchcancel", stopAction);

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    function loop() {
        frames++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();
        pipes.update();
        pipes.draw();

        fg.update();
        fg.draw();

        bird.update();
        bird.draw();

        drawUI();

        requestAnimationFrame(loop);
    }

    function safeInit() {
        resizeCanvas();
        requestAnimationFrame(loop);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(safeInit, 100);
    } else {
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(safeInit, 100);
        });
    }
</script>
</body>
</html>
